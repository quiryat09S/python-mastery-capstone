name: CI/CD

on:
  push:
    branches:
      - "**"

  pull_request:
    branches:
      - main

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Instalar Poetry
        run: |
          python -m pip install --upgrade pip
          pip install poetry

      - name: Verificar Poetry
        run: poetry --version

      - name: Instalar dependencias
        run: poetry install --no-interaction --no-root

      - name: Auditar dependencias
        run: poetry run pip-audit --local

      - name: Ejecutar Ruff
        run: poetry run ruff check .

      - name: Verificar formato con Black
        run: poetry run black --check .

      - name: Verificar imports con Isort
        run: poetry run isort --check-only .

      - name: Ejecutar Mypy
        run: poetry run mypy .

      - name: Ejecutar pruebas y cobertura
        run: >
          poetry run pytest
          labs/day09_fast_api/tests
          --cov=labs.day09_fast_api
          --cov-report=term-missing
          --cov-report=xml
          --cov-fail-under=80
      
      - name: Construir wheel
        run: poetry build

      - name: Publicar wheel como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: python-wheel
          path: dist/*


  docker:
    name: docker
    needs: quality
    runs-on: ubuntu-latest

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Iniciar sesión en GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Configurar Buildx
        uses: docker/setup-buildx-action@v3

      - name: Generar metadatos de imagen
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}

      - name: Construir y publicar imagen
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max