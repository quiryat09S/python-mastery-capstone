[project]
name = "python-mastery-capstone"
version = "0.1.0"
description = ""
authors = [
    {name = "KatherineQ",email = "quiryat060809@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "pydantic (>=2.13.5,<3.0.0)",
    "email-validator (>=2.3.0,<3.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "sqlalchemy (>=2.0.54,<3.0.0)",
    "alembic (>=1.20.0,<2.0.0)",
    "fastapi (>=0.141.1,<0.142.0)",
    "uvicorn[standard] (>=0.53.0,<0.54.0)",
    "pyjwt (>=2.15.0,<3.0.0)",
    "python-multipart (>=0.0.32,<0.0.33)",
    "python-jose (>=3.5.0,<4.0.0)",
    "pwdlib[argon2] (>=0.3.1,<0.4.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "black (>=26.5.1,<27.0.0)",
    "isort (>=9.0.1,<10.0.0)",
    "ruff (>=0.16.7,<0.17.0)",
    "pre-commit (>=4.6.2,<5.0.0)",
    "mypy (>=2.3.1,<3.0.0)",
    "pytest (>=9.1.1,<10.0.0)",
    "aiohttp (>=3.14.3,<4.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "types-python-jose (>=3.5.0.20260408,<4.0.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
    "hypothesis (>=6.168.1,<7.0.0)"
]

[tool.black]
target-version = ["py312"]
line-length = 79

[tool.mypy]
explicit_package_bases = true

[tool.poetry]
name = "python-mastery-capstone"
version = "0.1.0"
package-mode = false

[tool.ruff]
target-version = "py312"
line-length = 79

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "UP",
]

ignore = [
    "B008",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
filterwarnings = [
    "ignore:Using `httpx` with `starlette.testclient` is deprecated.*",
]